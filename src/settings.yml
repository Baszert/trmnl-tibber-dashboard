---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://api.tibber.com/v1-beta/gql
polling_headers: authorization={{api_key}}&content-type=application/json
polling_body: '{"query": "{ viewer { name accountType homes { id appNickname timeZone type size numberOfResidents primaryHeatingSource mainFuseSize\n  address { city country }\n  features { realTimeConsumptionEnabled }\n  meteringPointData { gridCompany priceAreaCode estimatedAnnualConsumption }\n  currentSubscription { status validFrom\n    priceInfo(resolution: QUARTER_HOURLY) {\n      current { total energy tax startsAt level currency }\n      today { total startsAt level }\n      tomorrow { total startsAt level } } }\n  hourCons: consumption(resolution: HOURLY, last: 48) { nodes { from to cost consumption unitPrice } }\n  dayCons: consumption(resolution: DAILY, last: 35) { nodes { from to cost consumption } }\n  hourProd: production(resolution: HOURLY, last: 48) { nodes { from to production profit } }\n  dayProd: production(resolution: DAILY, last: 35) { nodes { from to production profit } }\n} } }\n"}'
id: 188591
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About this plugin
  description: Your Tibber energy price as one clear curve. See the price right now, the cheapest and most expensive hours ahead, tomorrow's range, and your usage, cost and solar at a glance. Works on TRMNL OG and X, landscape and portrait, in English, Dutch, German, Swedish and Norwegian.<br><br>Update October 2026 - completely new design with 15-minute prices. Solar panels are detected automatically.
  category: analytics
  email_address: trmnl@achtnegen.nl
  github_url: https://github.com/Baszert/trmnl-tibber-dashboard
- keyname: api_key
  field_type: string
  name: API Key
  description: This token can be generated at the <a href="https://developer.tibber.com/settings/access-token" class="underline" target="_blank">Tibber Developer Dashboard</a>.
- keyname: home
  field_type: number
  name: Home number
  description: Only needed if you have more than one Tibber home. 1 is your first home.
  default: 1
  min: 1
  max: 9
  optional: true
- keyname: language
  field_type: select
  name: Language
  description: Auto follows your TRMNL account language.
  options:
  - Auto
  - English
  - Nederlands
  - Deutsch
  - Svenska
  - Norsk
  default: Auto
  optional: true
- keyname: unit
  field_type: select
  name: Price unit
  description: Whole currency units (0.201) or cents (20.1 ct).
  options:
  - Euro
  - Cents
  default: Euro
  optional: true
- keyname: window
  field_type: select
  name: Cheapest block
  description: Length of the cheapest block to highlight (hours).
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  default: '2'
  optional: true
name: Tibber
description: Dashboard (NL, DE, SE, NOR)
refresh_interval: 15
